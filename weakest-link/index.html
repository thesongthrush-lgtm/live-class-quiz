<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1230">
<title>Join Last One Standing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="css/wl.css?v=20261124190320">
<script src="../config.js?v=20261124190320"></script>
</head>
<body class="phone-body">
<div id="app"><div class="wl-phone"><div class="ph-card"><p>Loading…</p></div></div></div>
<script type="module">
  import { mountPlayer } from "./js/wl-player.js?v=20261124190320";
  import { el } from "../js/common.js?v=20261124190320";
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const code = (params.get("g") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const shell = (...k) => { app.textContent = ""; app.append(el("div", { class: "wl-phone" }, el("div", { class: "ph-card" }, ...k))); };
  function ask(msg) {
    const input = el("input", { type: "text", maxlength: 6, placeholder: "Game code", autocapitalize: "characters", autocomplete: "off", class: "codein" });
    shell(el("h1", { class: "brand center" }, "⚡ Last One Standing"), el("h2", null, "Join a game"), msg ? el("p", { class: "muted" }, msg) : null, input,
      el("button", { class: "btn wide big", text: "Join", onclick: () => { const c = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c) location.search = "?g=" + c; } }));
  }
  (async () => {
    if (!window.FIREBASE_CONFIG) return shell(el("h2", null, "Not set up yet"));
    if (!code) return ask();
    try {
      const { playerNet } = await import("./js/wl-net.js?v=20261124190320");
      const net = await playerNet(window.FIREBASE_CONFIG, code);
      if (!(await net.exists(code))) return ask(`There's no game with the code ${code}. Check the screen and try again.`);
      app.textContent = "";
      const root = el("div"); app.append(root);
      mountPlayer(root, net, { code });
    } catch (e) { ask("Couldn't connect. Check your internet connection and try again."); console.error(e); }
  })();
</script>
</body>
</html>
